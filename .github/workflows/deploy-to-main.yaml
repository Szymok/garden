name: Deploy Garden to Main Website

on:
  push:
    branches:
      - quartz-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Garden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz Site
        run: npx quartz build -o public/garden

      # The build above is a smoke test only. The website's own deploy.yml
      # checks out this repo and builds the garden into _site/garden itself,
      # so no HTML is ever committed to szymok.github.io.
      - name: Trigger szymok.github.io deploy
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TO_MAIN_WEBSITE_TOKEN }}
        run: gh workflow run deploy.yml -R Szymok/szymok.github.io --ref main
